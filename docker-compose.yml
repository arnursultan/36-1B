version: "3.9"

services:

  db:
    image: postgres:17
    container_name: postgres
    restart: always

    environment:
      POSTGRES_DB: geeks
      POSTGRES_USER: geeks
      POSTGRES_PASSWORD: geeks

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:8
    container_name: redis
    restart: always

    ports:
      - "6379:6379"


  web:
    build: .

    container_name: django

    command: gunicorn core.wsgi:application -c gunicorn.conf.py

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - db
      - redis


  worker:
    build: .

    command: celery -A core worker -l info

    depends_on:
      - redis
      - db


  beat:
    build: .

    command: celery -A core beat -l info

    depends_on:
      - redis
      - db


  flower:
    build: .

    command: celery -A core flower

    ports:
      - "5555:5555"

    depends_on:
      - redis


  nginx:

    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

volumes:
  postgres_data: